[project]
name = "cloudremoval"
version = "0.1.0"
description = "Sentinel-2 cloud removal using Modified DSen2-CR + SAR (ALLClear dataset)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # ---- Deep Learning ----
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
    # ---- Numerical ----
    "numpy>=1.26",
    "scipy>=1.13",
    # ---- Geospatial ----
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    # ---- Configuration ----
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # ---- Backend (Phase 3+) ----
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # ---- Database (Phase 3+) ----
    "sqlalchemy>=2.0",
    # ---- Utilities ----
    "tqdm>=4.66",
    "psutil>=5.9",
    "matplotlib>=3.11.1",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "WARNING"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
